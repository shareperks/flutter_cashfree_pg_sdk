name: shareperks
description: "A clone of the shareplus package."
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hugeicons: ^1.1.6
  hugeicons_pro: ^0.0.3
  lottie: ^3.3.3
  connectivity_plus: ^7.1.1
  go_router: ^17.2.0
  device_info_plus: ^13.0.0
  package_info_plus: ^10.0.0
  shared_preferences: ^2.5.5
  carousel_slider: ^5.1.2
  fluttertoast: ^9.0.0
  dio: ^5.9.2
  logger: ^2.7.0
  provider: ^6.1.5+1
  shimmer_animation: ^2.2.2+1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  url_launcher: ^6.3.2
  share_plus: ^13.0.0
  flutter_svg: ^2.2.4
  flutter_animate: ^4.5.2
  pinput: ^6.0.2
  soui:
    git:
      url: https://github.com/shareperks/soui.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


  assets:
    - assets/
    - assets/splash/
    - assets/lottie/

  fonts:
    - family: AlbertSans
      fonts:
        - asset: fonts/AlbertSans/AlbertSans-Thin.ttf
          weight: 100
        - asset: fonts/AlbertSans/AlbertSans-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: fonts/AlbertSans/AlbertSans-ExtraLight.ttf
          weight: 200
        - asset: fonts/AlbertSans/AlbertSans-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: fonts/AlbertSans/AlbertSans-Light.ttf
          weight: 300
        - asset: fonts/AlbertSans/AlbertSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: fonts/AlbertSans/AlbertSans-Regular.ttf
          weight: 400
        - asset: fonts/AlbertSans/AlbertSans-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/AlbertSans/AlbertSans-Medium.ttf
          weight: 500
        - asset: fonts/AlbertSans/AlbertSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: fonts/AlbertSans/AlbertSans-SemiBold.ttf
          weight: 600
        - asset: fonts/AlbertSans/AlbertSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/AlbertSans/AlbertSans-Bold.ttf
          weight: 700
        - asset: fonts/AlbertSans/AlbertSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: fonts/AlbertSans/AlbertSans-ExtraBold.ttf
          weight: 800
        - asset: fonts/AlbertSans/AlbertSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: fonts/AlbertSans/AlbertSans-Black.ttf
          weight: 900
        - asset: fonts/AlbertSans/AlbertSans-BlackItalic.ttf
          weight: 900
          style: italic
    - family: Inter
      fonts:
        - asset: fonts/Inter/Inter_18pt-Thin.ttf
          weight: 100
        - asset: fonts/Inter/Inter_18pt-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: fonts/Inter/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: fonts/Inter/Inter_18pt-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: fonts/Inter/Inter_18pt-Light.ttf
          weight: 300
        - asset: fonts/Inter/Inter_18pt-LightItalic.ttf
          weight: 300
          style: italic
        - asset: fonts/Inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: fonts/Inter/Inter_18pt-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/Inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: fonts/Inter/Inter_18pt-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: fonts/Inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter/Inter_18pt-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/Inter/Inter_18pt-Bold.ttf
          weight: 700
        - asset: fonts/Inter/Inter_18pt-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: fonts/Inter/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: fonts/Inter/Inter_18pt-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: fonts/Inter/Inter_18pt-Black.ttf
          weight: 900
        - asset: fonts/Inter/Inter_18pt-BlackItalic.ttf
          weight: 900
          style: italic


flutter_assets:
  assets_path: assets/
  output_path: lib/constants/
  filename: assets.dart
